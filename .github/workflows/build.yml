name: Build Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # 5AM EST

permissions:
  contents: read # access to check out code and install dependencies

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      RUBY_YJIT_ENABLE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install minify
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with: # Grab the latest version
          repo: tdewolff/minify
          tag: v2.24.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build docs
        run: bundle exec rake build
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          OPEN_METEO_API_URL: ${{ secrets.OPEN_METEO_API_URL }}
      - name: Sanity check build output
        run: test -s docs/index.html
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 945954ae6af55e6e4af004fb7772fdc5
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy docs/ --project-name followthesnow
